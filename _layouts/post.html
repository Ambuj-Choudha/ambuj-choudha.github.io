---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.author %} :: {{ page.author }}{% else %} :: {{ site.author }}{% endif %}
    </div>
    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
      </div>
    {% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← back to blog</a></p>
</article>
